name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Format
        run: npm run format:check

      - name: TypeScript API smoke test
        run: npm run test:types

      - name: Test with coverage thresholds
        run: npm run test:coverage

      - name: Security audit
        run: npm audit --audit-level=moderate

      - name: Package dry-run
        run: npm pack --workspaces --dry-run

  compatibility:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
            smoke: true
          - os: ubuntu-latest
            node: '24'
          - os: ubuntu-latest
            node: '26'
          - os: windows-latest
            node: '24'
            windowsSmoke: true
          - os: macos-latest
            node: '24'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Setup Python on Windows
        if: matrix.windowsSmoke
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Create Python virtual environment on Windows
        if: matrix.windowsSmoke
        run: python -m venv .venv

      - name: Install production dependencies
        if: matrix.smoke
        run: npm ci --omit=dev

      - name: Install dependencies
        if: ${{ !matrix.smoke }}
        run: npm ci

      - name: Runtime smoke test
        if: matrix.smoke
        run: |
          node packages/cli/bin/deplens.js --version
          node --input-type=module -e "import('./packages/core/src/index.mjs').then(m => { if (typeof m.runInspect !== 'function') process.exit(1) })"

      - name: Test
        if: ${{ !matrix.smoke && !matrix.windowsSmoke }}
        run: npm test

      - name: Windows compatibility smoke tests
        if: matrix.windowsSmoke
        run: |
          npm --workspace @deplens/core exec -- vitest run __tests__/analyze-python.test.js
          npm --workspace @deplens/core exec -- vitest run __tests__/language-detector.test.js
          node packages/cli/bin/deplens.js zod --types --no-runtime --json --detail compact --select 'package,symbols' --max-symbols 5
          npm --workspace @deplens/mcp test

  real-package-corpus:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run pinned real-package compatibility corpus
        run: npm run test:corpus
