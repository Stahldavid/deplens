name: Publish to npm

# Three trigger paths:
#
# 1. push to main          → Changesets flow:
#      - If pending changesets (.changeset/*.md) exist, open/update a
#        "Version Packages" PR that bumps versions + writes CHANGELOG.
#      - If no pending changesets, run `npx changeset publish` which
#        publishes every workspace whose package.json version isn't on
#        npm yet (idempotent: already-published versions are skipped).
#
# 2. tag push (core-v*/cli-v*/mcp-v*)  → legacy manual fallback:
#        Publish only that one package (parsed from the tag name).
#        Useful for hotfixes or for republishing a single package.
#
# 3. workflow_dispatch with `package` input  →  manual single-package publish.
#
# All paths run from this single workflow file so the npm Trusted
# Publisher OIDC configuration only needs to point at `publish.yml`.
on:
  push:
    branches:
      - main
    tags:
      - 'core-v*'
      - 'cli-v*'
      - 'mcp-v*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Which package to publish (workflow_dispatch only)'
        required: true
        type: choice
        options:
          - '@deplens/core'
          - '@deplens/cli'
          - '@deplens/mcp'

# Cancel in-flight runs for the same ref to avoid race conditions on the
# "Version Packages" PR.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # --------------------------------------------------------------------------
  # Job 1 — Changesets flow on push to main
  # --------------------------------------------------------------------------
  changesets:
    name: Changesets release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # push the "Version Packages" branch + tags
      pull-requests: write   # open / update the Version PR
      id-token: write        # OIDC for npm Trusted Publisher + provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # changesets needs full history to compute diffs

      - name: Setup Node.js
        # Node 24 ships with npm 11.x, required by npm Trusted Publishers.
        # See https://docs.npmjs.com/trusted-publishers
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify toolchain versions
        run: node --version && npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NPM_TOKEN deliberately not set — npm CLI falls back to OIDC
          # when no auth token is provided and id-token: write is granted.
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Summarize outcome
        if: always()
        run: |
          if [[ "${{ steps.changesets.outputs.published }}" == "true" ]]; then
            echo "::notice::Published packages: ${{ steps.changesets.outputs.publishedPackages }}"
          elif [[ "${{ steps.changesets.outputs.hasChangesets }}" == "true" ]]; then
            echo "::notice::Pending changesets — 'Version Packages' PR opened/updated. Merge it to publish."
          else
            echo "::notice::No pending changesets and nothing to publish. Up to date."
          fi

  # --------------------------------------------------------------------------
  # Job 2 — Manual / tag-driven single-package publish (legacy fallback)
  # --------------------------------------------------------------------------
  manual-publish:
    name: Manual publish (single package)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write   # OIDC for npm Trusted Publisher + provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Determine package from tag or input
        id: pkg
        shell: bash
        run: |
          if [[ -n "${{ github.event.inputs.package }}" ]]; then
            NAME="${{ github.event.inputs.package }}"
          else
            TAG="${GITHUB_REF_NAME}"
            case "$TAG" in
              core-v*) NAME="@deplens/core" ;;
              cli-v*)  NAME="@deplens/cli"  ;;
              mcp-v*)  NAME="@deplens/mcp"  ;;
              *)
                echo "::error::Tag '$TAG' does not match a known pattern (core-v*, cli-v*, mcp-v*)."
                exit 1
                ;;
            esac
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Publishing $NAME"

      - name: Verify local version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          TAG_VERSION="${TAG#*-v}"
          PKG="${{ steps.pkg.outputs.name }}"
          WS_DIR="packages/${PKG##*/}"
          PKG_VERSION="$(node -p "require('./${WS_DIR}/package.json').version")"
          if [[ "$TAG_VERSION" != "$PKG_VERSION" ]]; then
            echo "::error::Tag version '$TAG_VERSION' does not match ${WS_DIR}/package.json version '$PKG_VERSION'."
            exit 1
          fi
          echo "Version check OK: tag=$TAG_VERSION matches $WS_DIR/package.json"

      - name: Publish (provenance is automatic via OIDC)
        env:
          NODE_AUTH_TOKEN: ''
        run: |
          npm --workspace "${{ steps.pkg.outputs.name }}" publish --access public
