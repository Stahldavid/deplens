name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Format
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Security audit
        run: npm audit --audit-level=moderate

      - name: Package dry-run
        run: npm pack --workspaces --dry-run

  compatibility:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '18'
            smoke: true
          - os: ubuntu-latest
            node: '20'
          - os: ubuntu-latest
            node: '22'
          - os: ubuntu-latest
            node: '24'
          - os: windows-latest
            node: '24'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install production dependencies
        if: matrix.smoke
        run: npm ci --omit=dev

      - name: Install dependencies
        if: ${{ !matrix.smoke }}
        run: npm ci

      - name: Runtime smoke test
        if: matrix.smoke
        run: |
          node packages/cli/bin/deplens.js --version
          node --input-type=module -e "import('./packages/core/src/index.mjs').then(m => { if (typeof m.runInspect !== 'function') process.exit(1) })"

      - name: Test
        if: ${{ !matrix.smoke }}
        run: npm test
